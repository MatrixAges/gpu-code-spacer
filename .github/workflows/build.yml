name: Build GCS

on:
  push:
    branches: [build]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            binary: gcs
            target: x86_64-linux-gnu
            ggml-prefix: .deps/ggml-linux-install
            ggml-bootstrap: --ggml-linux
            archive: tar.gz
          - platform: macos-aarch64
            binary: gcs
            target: native
            ggml-prefix: .deps/ggml-install
            ggml-bootstrap: --ggml
            archive: tar.gz
          - platform: windows-x86_64
            binary: gcs.exe
            target: x86_64-windows-gnu
            ggml-prefix: .deps/ggml-windows-install
            ggml-bootstrap: --ggml-windows
            archive: zip

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build ggml
        run: zig build bootstrap -- --ggml

      - name: Cross-compile target ggml
        if: matrix.target != 'native'
        run: zig build bootstrap -- ${{ matrix.ggml-bootstrap }}

      - name: Build binary and export GGUF
        run: |
          mkdir -p artifacts/package

          zig build -Doptimize=ReleaseSmall -Dcpu=baseline -Dtarget=${{ matrix.target }} -Dggml-prefix=${{ matrix.ggml-prefix }}
          file zig-out/bin/${{ matrix.binary }}
          zig build export-gguf -Doptimize=ReleaseSmall -- models/spacer.weights artifacts/package/spacer.gguf

      - name: Check native binary startup
        if: matrix.target == 'native'
        run: |
          zig-out/bin/gcs --help
          zig-out/bin/gcs --model-info

      - name: Package
        env:
          PLATFORM: ${{ matrix.platform }}
          BINARY: ${{ matrix.binary }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          cp "zig-out/bin/${BINARY}" README.md LICENSE artifacts/package/
          cp models/metadata.json models/config.zig artifacts/package/
          printf '%s\n' "$GITHUB_SHA" > artifacts/package/COMMIT

          if [ "$ARCHIVE" = zip ]; then
            (cd artifacts/package && zip "../gcs-${PLATFORM}.zip" ./*)
          else
            tar -czf "artifacts/gcs-${PLATFORM}.tar.gz" -C artifacts/package .
          fi

          cd artifacts
          shasum -a 256 "gcs-${PLATFORM}.${ARCHIVE}" > "gcs-${PLATFORM}.${ARCHIVE}.sha256"

      - name: Upload binary package
        uses: actions/upload-artifact@v7
        with:
          name: gcs-${{ matrix.platform }}
          path: |
            artifacts/gcs-${{ matrix.platform }}.${{ matrix.archive }}
            artifacts/gcs-${{ matrix.platform }}.${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload standalone GGUF
        if: matrix.platform == 'linux-x86_64'
        uses: actions/upload-artifact@v7
        with:
          name: gcs-gguf
          path: artifacts/package/spacer.gguf
          if-no-files-found: error
          retention-days: 30
