name: Build GCS

on:
  push:
    branches: [build]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare build revision
    runs-on: macos-15
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      version: ${{ steps.revision.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'master' || github.sha }}
          fetch-depth: 0

      - name: Prepare source version
        id: revision
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          path = Path("build.zig.zon")
          manifest = path.read_text()
          match = re.search(r'^\s*\.version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"', manifest, re.MULTILINE)
          if match is None:
              raise SystemExit("Expected a numeric major.minor.patch version in build.zig.zon")

          package_version = match.group(1)
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              major, minor, patch = map(int, package_version.split("."))
              carry, patch = divmod(patch + 1, 10)
              carry, minor = divmod(minor + carry, 10)
              major += carry
              package_version = f"{major}.{minor}.{patch}"

              path.write_text(manifest[:match.start(1)] + package_version + manifest[match.end(1):])
              subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
              subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
              subprocess.run(["git", "add", "build.zig.zon"], check=True)
              subprocess.run(["git", "commit", "-m", f"chore: release v{package_version}"], check=True)

          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          version = f"v{package_version}"

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"sha={sha}\nversion={version}\n")
          print(f"Building {version} from {sha}")
          PY

      - name: Publish version to master and build
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: git push --atomic origin HEAD:refs/heads/master HEAD:refs/heads/build

  build:
    name: ${{ matrix.platform }} / ${{ needs.prepare.outputs.version }}
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            binary: gcs
            target: x86_64-linux-gnu
            ggml-prefix: .deps/ggml-linux-install
            ggml-bootstrap: --ggml-linux
            extension: ''
          - platform: macos-aarch64
            binary: gcs
            target: native
            ggml-prefix: .deps/ggml-install
            ggml-bootstrap: --ggml
            extension: ''
          - platform: windows-x86_64
            binary: gcs.exe
            target: x86_64-windows-gnu
            ggml-prefix: .deps/ggml-windows-install
            ggml-bootstrap: --ggml-windows
            extension: .exe

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build ggml
        run: zig build bootstrap -- --ggml

      - name: Cross-compile target ggml
        if: matrix.target != 'native'
        run: zig build bootstrap -- ${{ matrix.ggml-bootstrap }}

      - name: Build binary and export GGUF
        run: |
          mkdir -p artifacts

          zig build -Doptimize=ReleaseSmall -Dcpu=baseline -Dtarget=${{ matrix.target }} -Dggml-prefix=${{ matrix.ggml-prefix }}
          file zig-out/bin/${{ matrix.binary }}
          zig build export-gguf -Doptimize=ReleaseSmall -- models/spacer.weights artifacts/spacer-${{ needs.prepare.outputs.version }}.gguf

      - name: Check native binary startup
        if: matrix.target == 'native'
        run: |
          zig-out/bin/gcs --help
          zig-out/bin/gcs --model-info

      - name: Name binary
        env:
          PLATFORM: ${{ matrix.platform }}
          BINARY: ${{ matrix.binary }}
          EXTENSION: ${{ matrix.extension }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cp "zig-out/bin/${BINARY}" "artifacts/gcs-${VERSION}-${PLATFORM}${EXTENSION}"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/gcs-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}${{ matrix.extension }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload standalone GGUF
        if: matrix.platform == 'linux-x86_64'
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/spacer-${{ needs.prepare.outputs.version }}.gguf
          archive: false
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: github.event_name == 'workflow_dispatch'
    needs: [prepare, build]
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate changelog and publish raw assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: python3 tools/release.py
